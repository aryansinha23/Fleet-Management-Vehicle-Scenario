<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fleet Wallet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0A1220;
    --surface: #121B2E;
    --surface-2: #1A2740;
    --hairline: #26334C;
    --text-primary: #ECEAE3;
    --text-muted: #7E8BA3;
    --gold: #E7A64B;
    --gold-dim: #4A3A22;
    --mint: #34C48F;
    --mint-dim: #17362A;
    --red: #E2635C;
    --red-dim: #3A2020;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  body{
    background: var(--bg);
    color: var(--text-primary);
    font-family: 'IBM Plex Sans', sans-serif;
    padding: 40px 24px 80px;
    min-height: 100vh;
  }

  .wrap{ max-width: 980px; margin: 0 auto; }

  /* ---- Header ---- */
  header{
    display:flex;
    justify-content: space-between;
    align-items: flex-end;
    flex-wrap: wrap;
    gap: 20px;
    padding-bottom: 28px;
    border-bottom: 1px solid var(--hairline);
    margin-bottom: 32px;
  }
  .brand{
    display:flex;
    align-items:center;
    gap: 10px;
  }
  .brand-mark{
    width: 34px; height: 34px;
    border-radius: 9px;
    background: linear-gradient(155deg, var(--gold), #B97A2A);
    display:flex; align-items:center; justify-content:center;
    font-family:'Space Grotesk', sans-serif;
    font-weight:700; color:#0A1220; font-size:16px;
  }
  .brand-name{
    font-family:'Space Grotesk', sans-serif;
    font-size: 19px;
    font-weight: 600;
    letter-spacing: 0.2px;
  }
  .brand-sub{ font-size: 12.5px; color: var(--text-muted); margin-top: 2px; }

  .hero-figure{ text-align: right; }
  .hero-figure .label{ font-size: 12.5px; color: var(--text-muted); margin-bottom: 4px; }
  .hero-figure .value{
    font-family:'Space Grotesk', sans-serif;
    font-size: 34px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .hero-figure .value span{ font-size: 17px; color: var(--text-muted); font-weight: 500; }

  /* ---- Account cards ---- */
  .accounts{
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-bottom: 28px;
  }
  @media (max-width: 720px){ .accounts{ grid-template-columns: 1fr; } }

  .account{
    background: var(--surface);
    border: 1px solid var(--hairline);
    border-radius: 16px;
    padding: 22px;
  }

  .account-top{
    display:flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 18px;
  }
  .account-name{ font-family:'Space Grotesk', sans-serif; font-size: 18px; font-weight: 600; }
  .account-type{ font-size: 12.5px; color: var(--text-muted); margin-top: 3px; }
  .account-tag{
    font-size: 11.5px;
    color: var(--text-muted);
    border: 1px solid var(--hairline);
    border-radius: 20px;
    padding: 4px 10px;
    white-space: nowrap;
  }

  .gauge-row{
    display:flex;
    align-items:center;
    gap: 20px;
    padding: 14px 0 18px;
  }
  .gauge-numbers{ flex:1; }
  .balance-label{ font-size: 12.5px; color: var(--text-muted); margin-bottom: 4px; }
  .balance-value{
    font-family:'Space Grotesk', sans-serif;
    font-size: 30px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .balance-value span{ font-size: 15px; color: var(--text-muted); font-weight: 500; margin-left: 2px;}

  .stat-strip{
    display:flex;
    gap: 12px;
    margin-top: 12px;
  }
  .stat-chip{
    flex: 1;
    background: var(--surface-2);
    border-radius: 10px;
    padding: 10px 12px;
  }
  .stat-chip .k{ font-size: 11px; color: var(--text-muted); }
  .stat-chip .v{ font-family:'IBM Plex Mono', monospace; font-size: 14px; font-weight: 500; margin-top: 3px; font-variant-numeric: tabular-nums; }

  /* ---- Ledger ---- */
  .ledger-title{
    font-size: 12.5px;
    color: var(--text-muted);
    margin: 20px 0 10px;
    display:flex; justify-content: space-between;
  }
  .ledger{ display:flex; flex-direction:column; gap: 8px; }
  .entry{
    display:flex;
    align-items:center;
    gap: 12px;
    padding: 10px 12px;
    border-radius: 10px;
    background: var(--surface-2);
  }
  .entry.failed{ background: transparent; border: 1px dashed var(--hairline); opacity: 0.75; }
  .entry-icon{
    width: 30px; height: 30px;
    border-radius: 8px;
    display:flex; align-items:center; justify-content:center;
    font-size: 14px;
    flex-shrink: 0;
  }
  .entry-icon.debit{ background: var(--red-dim); color: var(--red); }
  .entry-icon.credit{ background: var(--mint-dim); color: var(--mint); }
  .entry-icon.blocked{ background: var(--surface); color: var(--text-muted); border: 1px solid var(--hairline); }

  .entry-info{ flex: 1; min-width: 0; }
  .entry-title{ font-size: 13.5px; font-weight: 500; }
  .entry-sub{ font-size: 11.5px; color: var(--text-muted); margin-top: 1px; }
  .entry-amount{
    font-family:'IBM Plex Mono', monospace;
    font-size: 13.5px;
    font-variant-numeric: tabular-nums;
    text-align: right;
    white-space: nowrap;
  }
  .entry-amount.debit{ color: var(--red); }
  .entry-amount.credit{ color: var(--mint); }
  .entry-amount.blocked{ color: var(--text-muted); }

  /* ---- Comparison ---- */
  .compare{
    background: var(--surface);
    border: 1px solid var(--hairline);
    border-radius: 16px;
    padding: 22px;
  }
  .compare-title{ font-family:'Space Grotesk', sans-serif; font-size: 16px; font-weight: 600; margin-bottom: 4px; }
  .compare-sub{ font-size: 12.5px; color: var(--text-muted); margin-bottom: 18px; }

  .bar-row{ margin-bottom: 14px; }
  .bar-label{
    display:flex; justify-content: space-between;
    font-size: 13px; margin-bottom: 6px;
  }
  .bar-label .amt{ font-family:'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; color: var(--text-muted); }
  .bar-track{
    height: 10px;
    background: var(--surface-2);
    border-radius: 6px;
    overflow: hidden;
  }
  .bar-fill{ height: 100%; border-radius: 6px; }

  .verdict{
    margin-top: 18px;
    padding-top: 16px;
    border-top: 1px solid var(--hairline);
    font-size: 13.5px;
    color: var(--text-muted);
  }
  .verdict b{ color: var(--text-primary); font-weight: 600; }

  footer{
    text-align:center;
    font-size: 11.5px;
    color: var(--text-muted);
    margin-top: 40px;
  }
</style>
</head>
<body>

<div class="wrap">

  <header>
    <div class="brand">
      <div class="brand-mark">FW</div>
      <div>
        <div class="brand-name">Fleet Wallet</div>
        <div class="brand-sub">Fuel balances &amp; trip ledger</div>
      </div>
    </div>
    <div class="hero-figure">
      <div class="label">Combined range on hand</div>
      <div class="value" id="combinedRange">– <span>km</span></div>
    </div>
  </header>

  <div class="accounts" id="accounts"></div>

  <div class="compare">
    <div class="compare-title">Range comparison</div>
    <div class="compare-sub">Who can go furthest right now, on the fuel currently in the tank.</div>
    <div id="compareBars"></div>
    <div class="verdict" id="verdict"></div>
  </div>

  <footer>Figures are simulated from the fleet's onboard fuel ledger, not live telemetry.</footer>

</div>

<script>
  /* =========================================================
     Vehicle logic — ported 1:1 from the Python Vehicle class.
     drive(), refuel() and check_range() keep the same rules;
     each call also pushes a ledger entry for the UI below.
     ========================================================= */

  class Vehicle {
    constructor(make, model, fuelLevel, mileage, tankCapacity) {
      this.make = make;
      this.model = model;
      this.fuelLevel = fuelLevel;       // litres
      this.mileage = mileage;           // km per litre
      this.tankCapacity = tankCapacity; // litres — cosmetic, for the gauge only
      this.ledger = [];
    }

    drive(distance) {
      const fuelNeeded = distance / this.mileage;
      if (fuelNeeded <= this.fuelLevel) {
        this.fuelLevel -= fuelNeeded;
        this.ledger.push({
          type: "debit",
          title: `Trip · ${distance} km`,
          sub: `Fuel used ${fuelNeeded.toFixed(2)} L`,
          amount: `-${fuelNeeded.toFixed(2)} L`
        });
      } else {
        this.ledger.push({
          type: "blocked",
          title: `Trip · ${distance} km`,
          sub: `Declined — needed ${fuelNeeded.toFixed(2)} L, had ${this.fuelLevel.toFixed(2)} L`,
          amount: "Declined"
        });
      }
    }

    refuel(litres) {
      if (litres <= 0) {
        this.ledger.push({
          type: "blocked",
          title: "Refuel",
          sub: "Amount must be positive",
          amount: "Declined"
        });
        return;
      }
      this.fuelLevel += litres;
      this.ledger.push({
        type: "credit",
        title: "Refuel",
        sub: `Added at the pump`,
        amount: `+${litres.toFixed(2)} L`
      });
    }

    checkRange() {
      return this.fuelLevel * this.mileage;
    }
  }

  /* ---- Run the same sequence as the Python main() ---- */
  const compactCar = new Vehicle("Maruti Suzuki", "Swift", 30.0, 22.0, 45);
  const deliveryTruck = new Vehicle("Tata", "407", 80.0, 6.0, 120);

  compactCar.drive(300);        // succeeds easily
  deliveryTruck.drive(600);     // needs 100L, has 80L -> declined

  deliveryTruck.refuel(50);
  deliveryTruck.drive(600);     // needs 100L, now has 130L -> succeeds

  const carRange = compactCar.checkRange();
  const truckRange = deliveryTruck.checkRange();

  /* =========================================================
     Rendering — banking-app style account cards + ledger
     ========================================================= */

  function iconFor(entry) {
    if (entry.type === "credit") return "↓";
    if (entry.type === "debit") return "↑";
    return "×";
  }

  function accountCardHTML(v, accentColor, tag) {
    const pct = Math.max(0, Math.min(1, v.fuelLevel / v.tankCapacity));
    const range = v.checkRange();

    const entriesHTML = v.ledger.map(e => `
      <div class="entry ${e.type === 'blocked' ? 'failed' : ''}">
        <div class="entry-icon ${e.type}">${iconFor(e)}</div>
        <div class="entry-info">
          <div class="entry-title">${e.title}</div>
          <div class="entry-sub">${e.sub}</div>
        </div>
        <div class="entry-amount ${e.type}">${e.amount}</div>
      </div>
    `).join("");

    return `
      <div class="account">
        <div class="account-top">
          <div>
            <div class="account-name">${v.make} ${v.model}</div>
            <div class="account-type">${tag}</div>
          </div>
          <div class="account-tag">${v.mileage.toFixed(1)} km/L</div>
        </div>

        <div class="gauge-row">
          ${gaugeSVG(pct, accentColor)}
          <div class="gauge-numbers">
            <div class="balance-label">Fuel balance</div>
            <div class="balance-value">${v.fuelLevel.toFixed(2)}<span>L</span></div>
          </div>
        </div>

        <div class="stat-strip">
          <div class="stat-chip">
            <div class="k">Current range</div>
            <div class="v">${range.toFixed(0)} km</div>
          </div>
          <div class="stat-chip">
            <div class="k">Tank capacity</div>
            <div class="v">${v.tankCapacity} L</div>
          </div>
        </div>

        <div class="ledger-title"><span>Recent activity</span><span>${v.ledger.length} entries</span></div>
        <div class="ledger">${entriesHTML}</div>
      </div>
    `;
  }

  function gaugeSVG(pct, color) {
    const r = 30, stroke = 7, c = 2 * Math.PI * r;
    const offset = c * (1 - pct);
    return `
      <svg width="76" height="76" viewBox="0 0 76 76" style="flex-shrink:0;">
        <circle cx="38" cy="38" r="${r}" fill="none" stroke="var(--surface-2)" stroke-width="${stroke}"/>
        <circle cx="38" cy="38" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}"
          stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${offset}"
          transform="rotate(-90 38 38)"/>
        <text x="38" y="43" text-anchor="middle" font-family="Space Grotesk, sans-serif"
          font-size="15" font-weight="600" fill="var(--text-primary)">${Math.round(pct*100)}%</text>
      </svg>
    `;
  }

  document.getElementById("accounts").innerHTML =
    accountCardHTML(compactCar, "#E7A64B", "Compact car") +
    accountCardHTML(deliveryTruck, "#34C48F", "Delivery truck");

  document.getElementById("combinedRange").innerHTML =
    `${(carRange + truckRange).toFixed(0)} <span>km</span>`;

  /* ---- Comparison bars ---- */
  const maxRange = Math.max(carRange, truckRange);
  function barRow(name, range, color) {
    const pct = (range / maxRange) * 100;
    return `
      <div class="bar-row">
        <div class="bar-label"><span>${name}</span><span class="amt">${range.toFixed(0)} km</span></div>
        <div class="bar-track"><div class="bar-fill" style="width:${pct}%; background:${color};"></div></div>
      </div>
    `;
  }

  document.getElementById("compareBars").innerHTML =
    barRow(`${compactCar.make} ${compactCar.model}`, carRange, "#E7A64B") +
    barRow(`${deliveryTruck.make} ${deliveryTruck.model}`, truckRange, "#34C48F");

  const diff = Math.abs(carRange - truckRange);
  const winner = carRange > truckRange ? `${compactCar.make} ${compactCar.model}`
               : truckRange > carRange ? `${deliveryTruck.make} ${deliveryTruck.model}`
               : null;

  document.getElementById("verdict").innerHTML = winner
    ? `<b>${winner}</b> has the greater range right now, by ${diff.toFixed(0)} km on the fuel currently on board.`
    : `Both vehicles have the same range on the fuel currently on board.`;
</script>

</body>
</html>
